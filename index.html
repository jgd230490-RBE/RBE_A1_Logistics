<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A1 Rail Baltica Logistics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #f5f5f5; color: #333; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; right: 0; left: 320px; transition: left 0.3s ease; }
        #menu-toggle { position: absolute; top: 15px; left: 15px; z-index: 1000; background: #ffffff; color: #0033A0; border: 1px solid #ccc; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s; }
        .sidebar { position: absolute; top: 0; bottom: 0; left: 0; width: 280px; background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-right: 1px solid #ddd; padding: 20px; z-index: 10; display: flex; flex-direction: column; gap: 15px; box-shadow: 4px 0 24px rgba(0,0,0,0.1); overflow-y: auto; transition: transform 0.3s ease; }
        .sidebar.closed { transform: translateX(-100%); }
        .sidebar h2 { margin: 0; font-size: 18px; font-weight: 700; color: #0033A0; text-transform: uppercase; padding-top: 40px; border-bottom: 2px solid #FFD600; padding-bottom: 5px;}
        .sidebar h3 { margin: 0; font-size: 11px; color: #666; text-transform: uppercase; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .kpi-container { display: flex; flex-direction: column; gap: 8px; }
        .kpi-card { background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid #eaeaea; }
        .kpi-val { font-size: 18px; font-weight: 700; color: #0033A0; margin-bottom: 2px; }
        .kpi-lbl { font-size: 10px; color: #555; text-transform: uppercase; font-weight: 600; }
        select, button { width: 100%; box-sizing: border-box; background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 8px; color: #333; font-size: 12px; margin-bottom: 5px; outline: none; }
        button { background: #0033A0; color: #fff; font-weight: bold; cursor: pointer; border: none; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .control-item { display: flex; align-items: center; justify-content: space-between; font-size: 12px; background: #f9f9f9; padding: 6px 10px; border-radius: 4px; border: 1px solid #eee; }
        .control-item label { display: flex; align-items: center; gap: 8px; cursor: pointer; width: 100%; font-weight: 500; }
        .color-dot { width: 12px; height: 3px; display: inline-block; margin-left: auto; }
        body.sidebar-closed #map { left: 0; }
        .mapboxgl-popup-content { background: #fff !important; color: #333 !important; border-radius: 8px !important; border: 1px solid #ccc !important; padding: 12px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.15) !important; font-family: 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
<div id="menu-toggle" onclick="document.getElementById('main-sidebar').classList.toggle('closed'); document.body.classList.toggle('sidebar-closed'); setTimeout(() => map.resize(), 300);">☰ Control Panel</div>
<div class="sidebar" id="main-sidebar">
    <h2>A1 Logistics Engine</h2>
    
    <div class="kpi-container">
        <h3>Live Filtered Metrics</h3>
        <div class="kpi-card"><div class="kpi-val" id="kpi-routes">0</div><div class="kpi-lbl">Active Routes</div></div>
    </div>

    <div class="control-group">
        <h3>Advanced Route Filtering</h3>
        <select id="filter-origin" onchange="applyFilters()"><option value="ALL">All Origins (Quarries/Ports)</option></select>
        <select id="filter-dest" onchange="applyFilters()"><option value="ALL">All Destinations (Compounds)</option></select>
        <select id="filter-section" onchange="applyFilters()"><option value="ALL">All Works Sections</option></select>
        <select id="filter-ipt" onchange="applyFilters()"><option value="ALL">All Sector IPTs</option></select>
        <button onclick="resetFilters()" style="background: #666;">Reset Filters</button>
    </div>

    <div class="control-group">
        <h3>Map Style & Overlays</h3>
        <select id="basemap-style">
            <option value="light-v11">Light (Default)</option>
            <option value="satellite-streets-v12">Satellite Streets</option>
            <option value="dark-v11">Dark Mode</option>
            <option value="streets-v12">Standard Streets</option>
            <option value="outdoors-v12">Outdoors</option>
        </select>
        <div class="control-item"><label><input type="checkbox" id="layer-alignment" checked onchange="toggleLayer('rail-alignment-layer')"> Rail Alignment</label><span class="color-dot" style="background-color: #000000; border-radius: 0; width: 12px; height: 1.5px;"></span></div>
        <div class="control-item"><label><input type="checkbox" id="layer-chainage" checked onchange="toggleLayer('chainage-layer')"> Chainage Markers</label><span class="color-dot" style="background-color: #333333; height:4px; border-radius:50%;"></span></div>
        <div class="control-item"><label><input type="checkbox" id="layer-nodes" checked onchange="toggleLayer('nodes-layer')"> Sites & Assets</label><span class="color-dot" style="background-color: #00FFFF; height:4px; border-radius:50%;"></span></div>
    </div>

    <div class="control-group">
        <h3>Forecasted Routing</h3>
        <div style="margin-bottom: 10px; padding: 10px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 4px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                <label style="font-size: 11px; font-weight: bold;">From Month:</label>
                <select id="timeline-from" style="font-size: 11px; padding: 2px;">
                    <option value="1">M1 (Jan)</option><option value="2">M2 (Feb)</option><option value="3">M3 (Mar)</option>
                    <option value="4">M4 (Apr)</option><option value="5" selected>M5 (May)</option><option value="6">M6 (Jun)</option>
                    <option value="7">M7 (Jul)</option><option value="8">M8 (Aug)</option><option value="9">M9 (Sep)</option>
                    <option value="10">M10 (Oct)</option><option value="11">M11 (Nov)</option><option value="12">M12 (Dec)</option>
                </select>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                <label style="font-size: 11px; font-weight: bold;">To Month:</label>
                <select id="timeline-to" style="font-size: 11px; padding: 2px;">
                    <option value="1">M1 (Jan)</option><option value="2">M2 (Feb)</option><option value="3">M3 (Mar)</option>
                    <option value="4">M4 (Apr)</option><option value="5">M5 (May)</option><option value="6">M6 (Jun)</option>
                    <option value="7">M7 (Jul)</option><option value="8">M8 (Aug)</option><option value="9">M9 (Sep)</option>
                    <option value="10">M10 (Oct)</option><option value="11" selected>M11 (Nov)</option><option value="12">M12 (Dec)</option>
                </select>
            </div>
            <button onclick="toggleForecastLayer()" style="width: 100%; padding: 4px; font-size: 11px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;">
                Calculate Timeline
            </button>
        </div>

        <div class="control-item">
            <label><input type="checkbox" id="toggle-forecast-routes" onchange="toggleForecastLayer()"> Show Routes</label>
            <span class="color-dot" style="background-color: #007bff; border-radius: 0; width: 12px; height: 3px;"></span>
        </div>
        <div id="forecast-status" style="margin-top: 5px; font-size: 11px; color: #666; padding-left: 24px;">
            Waiting for action...
        </div>
    </div>
    
    <div class="control-group">
        <h3>Logistics Paths</h3>
        <div class="control-item"><label><input type="checkbox" id="layer-inbound" checked onchange="toggleLayer('inbound-highway-layer')"> Inbound</label><span class="color-dot" style="background-color: #008000;"></span></div>
        <div class="control-item"><label><input type="checkbox" id="layer-outbound" checked onchange="toggleLayer('outbound-highway-layer')"> Outbound</label><span class="color-dot" style="background-color: #FFA500;"></span></div>
        <div class="control-item"><label><input type="checkbox" id="layer-temp" checked onchange="toggleLayer('temp-haul-layer')"> Temp Haul</label><span class="color-dot" style="background-color: #FF0000;"></span></div>
        <div class="control-item"><label><input type="checkbox" id="layer-rail" checked onchange="toggleLayer('rail-freight-layer')"> Rail Freight</label><span class="color-dot" style="background-color: #800080; border-top:1px dashed white;"></span></div>
    </div>
</div>

<div id="map"></div>

<script>
    // 1. DATA INJECTION
    const a1_data = {"type": "FeatureCollection", "features": []};
    const alignment_data = {"type": "FeatureCollection", "features": []};
    const chainage_global_data = {"type": "FeatureCollection", "features": []};

    // Global Key Detectors (Fixes Case Sensitivity Issues)
    window.typeKey = 'type'; 
    window.filterKeyMap = { origin: null, dest: null, section: null, ipt: null };

    // Find exactly how your CSV capitalized the "Type" column
    if (a1_data && a1_data.features && a1_data.features.length > 0) {
        let keys = Object.keys(a1_data.features[0].properties);
        let tk = keys.find(k => k.toLowerCase() === 'type' || k.toLowerCase() === 'route_type' || k.toLowerCase() === 'leg_type');
        if (tk) window.typeKey = tk;
    }

    // 2. MAPBOX INITIALIZATION
    mapboxgl.accessToken = 'pk.eyJ1IjoiamdkMjMwNDE5OTAiLCJhIjoiY21wcDgzdWl3MDFxNjJwczZzZ2NucDZvdCJ9.h-sg27GQ12YpCEfiXBlZGw';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/light-v11',
        center: [25.5, 58.7], 
        zoom: 7.5
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');

    document.getElementById('basemap-style').addEventListener('change', function(e) {
        map.setStyle('mapbox://styles/mapbox/' + e.target.value);
    });

    // 3. CORE RENDERING ENGINE
    map.on('style.load', function() {
        if (a1_data && a1_data.features) {
            if (!map.getSource('a1-routes-source')) {
                map.addSource('a1-routes-source', { type: 'geojson', data: a1_data });
            }
            setupBaselineLayers();
            populateFilters(); 
            applyFilters();    
        }
        
        if (alignment_data && alignment_data.features) {
            if (!map.getSource('rail-alignment-source')) {
                map.addSource('rail-alignment-source', { type: 'geojson', data: alignment_data });
            }
            if (!map.getLayer('rail-alignment-layer')) {
                var visAlign = document.getElementById('layer-alignment').checked ? 'visible' : 'none';
                map.addLayer({
                    id: 'rail-alignment-layer',
                    type: 'line',
                    source: 'rail-alignment-source',
                    paint: { 'line-color': '#000000', 'line-width': 1.5 },
                    layout: { 'visibility': visAlign }
                });
            }
        }

        if (chainage_global_data && chainage_global_data.features) {
            if (!map.getSource('chainage-source')) {
                map.addSource('chainage-source', { type: 'geojson', data: chainage_global_data });
            }
            if (!map.getLayer('chainage-layer')) {
                var visChainage = document.getElementById('layer-chainage').checked ? 'visible' : 'none';
                map.addLayer({
                    id: 'chainage-layer',
                    type: 'circle',
                    source: 'chainage-source',
                    paint: { 'circle-color': '#333333', 'circle-radius': 4 },
                    layout: { 'visibility': visChainage }
                });
            }
            if (!map.getLayer('nodes-layer')) {
                var visNodes = document.getElementById('layer-nodes').checked ? 'visible' : 'none';
                map.addLayer({
                    id: 'nodes-layer',
                    type: 'circle',
                    source: 'chainage-source',
                    paint: { 'circle-color': '#00FFFF', 'circle-radius': 6, 'circle-stroke-width': 1, 'circle-stroke-color': '#000000' },
                    layout: { 'visibility': visNodes }
                });
            }
        }

        if (document.getElementById('toggle-forecast-routes').checked) {
            toggleForecastLayer();
        }
    });

    function populateFilters() {
        if (!a1_data || !a1_data.features || a1_data.features.length === 0) return;
        
        let props = a1_data.features[0].properties;
        Object.keys(props).forEach(k => {
            let kl = k.toLowerCase();
            if (!window.filterKeyMap.origin && (kl.includes('origin') || kl.includes('quarry'))) window.filterKeyMap.origin = k;
            if (!window.filterKeyMap.dest && (kl.includes('dest') || kl.includes('compound'))) window.filterKeyMap.dest = k;
            if (!window.filterKeyMap.section && (kl.includes('section') || kl.includes('leg') || kl.includes('works'))) window.filterKeyMap.section = k;
            if (!window.filterKeyMap.ipt && (kl.includes('ipt') || kl.includes('sector'))) window.filterKeyMap.ipt = k;
        });

        let origins = new Set(), dests = new Set(), sections = new Set(), ipts = new Set();
        a1_data.features.forEach(f => {
            let p = f.properties;
            if (window.filterKeyMap.origin && p[window.filterKeyMap.origin]) origins.add(p[window.filterKeyMap.origin]);
            if (window.filterKeyMap.dest && p[window.filterKeyMap.dest]) dests.add(p[window.filterKeyMap.dest]);
            if (window.filterKeyMap.section && p[window.filterKeyMap.section]) sections.add(p[window.filterKeyMap.section]);
            if (window.filterKeyMap.ipt && p[window.filterKeyMap.ipt]) ipts.add(p[window.filterKeyMap.ipt]);
        });

        const addOptions = (selectId, set) => {
            let select = document.getElementById(selectId);
            if (select.options.length <= 1) { 
                Array.from(set).filter(Boolean).sort().forEach(val => {
                    let opt = document.createElement('option');
                    opt.value = val;
                    opt.innerHTML = val;
                    select.appendChild(opt);
                });
            }
        };

        addOptions('filter-origin', origins);
        addOptions('filter-dest', dests);
        addOptions('filter-section', sections);
        addOptions('filter-ipt', ipts);
    }

    function applyFilters() {
        let originVal = document.getElementById('filter-origin').value;
        let destVal = document.getElementById('filter-dest').value;
        let sectionVal = document.getElementById('filter-section').value;
        let iptVal = document.getElementById('filter-ipt').value;

        let filterArr = ['all'];
        if (originVal !== 'ALL' && window.filterKeyMap.origin) filterArr.push(['==', window.filterKeyMap.origin, originVal]);
        if (destVal !== 'ALL' && window.filterKeyMap.dest) filterArr.push(['==', window.filterKeyMap.dest, destVal]);
        if (sectionVal !== 'ALL' && window.filterKeyMap.section) filterArr.push(['==', window.filterKeyMap.section, sectionVal]);
        if (iptVal !== 'ALL' && window.filterKeyMap.ipt) filterArr.push(['==', window.filterKeyMap.ipt, iptVal]);

        // Fix: Use the dynamic auto-detected typeKey!
        const routeLayers = [
            {id: 'inbound-highway-layer', typeMatch: 'Inbound Highway'},
            {id: 'outbound-highway-layer', typeMatch: 'Outbound Highway'},
            {id: 'temp-haul-layer', typeMatch: 'Temp Haul Track'},
            {id: 'rail-freight-layer', typeMatch: 'Rail Link'}
        ];

        routeLayers.forEach(layer => {
            if (map.getLayer(layer.id)) {
                let layerFilter = ['all', ['==', window.typeKey, layer.typeMatch]];
                for(let i=1; i<filterArr.length; i++) layerFilter.push(filterArr[i]);
                map.setFilter(layer.id, layerFilter);
            }
        });

        if (map.getLayer('forecast-overlay-layer')) {
            let forecastFilter = ['all', ['==', 'is_forecast', true]];
            for(let i=1; i<filterArr.length; i++) forecastFilter.push(filterArr[i]);
            map.setFilter('forecast-overlay-layer', forecastFilter);
            if (map.getLayer('forecast-overlay-labels')) map.setFilter('forecast-overlay-labels', forecastFilter);
        }

        updateKPIs();
    }

    function updateKPIs() {
        let visibleCount = 0;
        a1_data.features.forEach(f => {
            let props = f.properties;
            let isVisible = true;
            
            if (document.getElementById('filter-origin').value !== 'ALL' && window.filterKeyMap.origin) {
                if (props[window.filterKeyMap.origin] !== document.getElementById('filter-origin').value) isVisible = false;
            }
            if (document.getElementById('filter-dest').value !== 'ALL' && window.filterKeyMap.dest) {
                if (props[window.filterKeyMap.dest] !== document.getElementById('filter-dest').value) isVisible = false;
            }
            if (document.getElementById('filter-section').value !== 'ALL' && window.filterKeyMap.section) {
                if (props[window.filterKeyMap.section] !== document.getElementById('filter-section').value) isVisible = false;
            }
            if (document.getElementById('filter-ipt').value !== 'ALL' && window.filterKeyMap.ipt) {
                if (props[window.filterKeyMap.ipt] !== document.getElementById('filter-ipt').value) isVisible = false;
            }

            if (isVisible) visibleCount++;
        });

        document.getElementById('kpi-routes').innerText = visibleCount;
    }

    function resetFilters() {
        document.getElementById('filter-origin').value = 'ALL';
        document.getElementById('filter-dest').value = 'ALL';
        document.getElementById('filter-section').value = 'ALL';
        document.getElementById('filter-ipt').value = 'ALL';
        applyFilters();
    }

    function setupBaselineLayers() {
        var visInbound = document.getElementById('layer-inbound').checked ? 'visible' : 'none';
        var visOutbound = document.getElementById('layer-outbound').checked ? 'visible' : 'none';
        var visTemp = document.getElementById('layer-temp').checked ? 'visible' : 'none';
        var visRail = document.getElementById('layer-rail').checked ? 'visible' : 'none';

        // Use auto-detected typeKey
        if (!map.getLayer('inbound-highway-layer')) {
            map.addLayer({
                id: 'inbound-highway-layer',
                type: 'line',
                source: 'a1-routes-source',
                filter: ['all', ['==', window.typeKey, 'Inbound Highway']],
                paint: { 'line-color': '#008000', 'line-width': 3 },
                layout: { 'visibility': visInbound }
            });
        }
        if (!map.getLayer('outbound-highway-layer')) {
            map.addLayer({
                id: 'outbound-highway-layer',
                type: 'line',
                source: 'a1-routes-source',
                filter: ['all', ['==', window.typeKey, 'Outbound Highway']],
                paint: { 'line-color': '#FFA500', 'line-width': 3 },
                layout: { 'visibility': visOutbound }
            });
        }
        if (!map.getLayer('temp-haul-layer')) {
            map.addLayer({
                id: 'temp-haul-layer',
                type: 'line',
                source: 'a1-routes-source',
                filter: ['all', ['==', window.typeKey, 'Temp Haul Track']],
                paint: { 'line-color': '#FF0000', 'line-width': 4 },
                layout: { 'visibility': visTemp }
            });
        }
        if (!map.getLayer('rail-freight-layer')) {
            map.addLayer({
                id: 'rail-freight-layer',
                type: 'line',
                source: 'a1-routes-source',
                filter: ['all', ['==', window.typeKey, 'Rail Link']],
                paint: { 'line-color': '#800080', 'line-width': 4, 'line-dasharray': [3, 2] },
                layout: { 'visibility': visRail }
            });
        }
        setupPopupInteractions();
    }

    function setupPopupInteractions() {
        const layers = ['inbound-highway-layer', 'outbound-highway-layer', 'temp-haul-layer', 'rail-freight-layer'];
        layers.forEach(function(layerId) {
            map.off('click', layerId);
            map.off('mouseenter', layerId);
            map.off('mouseleave', layerId);

            map.on('click', layerId, function(e) {
                if (e.features.length > 0 && e.features[0].properties.html) {
                    new mapboxgl.Popup()
                        .setLngLat(e.lngLat)
                        .setHTML(e.features[0].properties.html)
                        .addTo(map);
                }
            });
            map.on('mouseenter', layerId, function() { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', layerId, function() { map.getCanvas().style.cursor = ''; });
        });
    }

    // 6. FORECAST DATA JOIN LOGIC (FIXED GITHUB PATH: ./Scripts/...)
    async function toggleForecastLayer() {
        var checkbox = document.getElementById('toggle-forecast-routes');
        var statusText = document.getElementById('forecast-status');
        var fromMonth = parseInt(document.getElementById('timeline-from').value);
        var toMonth = parseInt(document.getElementById('timeline-to').value);
        
        // V1.5 FIX: The tiny dot '.' stops GitHub from throwing a 404 Error!
        var dataSourceUrl = './Scripts/wp3_timeline_forecast.csv'; 

        if (checkbox.checked) {
            statusText.innerHTML = "Calculating and joining data...";
            statusText.style.color = "#007bff";
            
            try {
                var response = await fetch(dataSourceUrl);
                if (!response.ok) throw new Error("Failed to load CSV source file.");
                var csvText = await response.text();

                var rows = csvText.replace(/\r/g, '').split('\n');
                var forecastLookup = {};
                var routesCount = 0;
                
                for (var i = 1; i < rows.length; i++) {
                    var row = rows[i].trim();
                    if (!row) continue; 
                    var cols = row.split(',');
                    if (cols.length < 5) continue;
                    
                    var routeId = cols[0];
                    var status = cols[1];
                    var jointUse = cols[2];
                    
                    if (status === 'Assigned') {
                        var totalVehicles = 0;
                        var peakVehicles = 0;
                        var monthCount = 0;

                        for (var m = fromMonth; m <= toMonth; m++) {
                            var colIndex = 3 + m; 
                            if (cols[colIndex]) {
                                var dailyVal = parseInt(cols[colIndex]) || 0;
                                totalVehicles += (dailyVal * 22); 
                                if (dailyVal > peakVehicles) peakVehicles = dailyVal;
                                monthCount++;
                            }
                        }

                        if (peakVehicles > 0) {
                            var avgDaily = Math.round((totalVehicles / 22) / monthCount);
                            forecastLookup[routeId] = {
                                joint_use: jointUse,
                                avg_daily: avgDaily,
                                peak_daily: peakVehicles,
                                total_est: totalVehicles,
                                timeline: "M" + fromMonth + " to M" + toMonth
                            };
                            routesCount++;
                        }
                    }
                }

                if (a1_data && a1_data.features) {
                    for (var j = 0; j < a1_data.features.length; j++) {
                        var feat = a1_data.features[j];
                        var rId = feat.properties.Route_ID || feat.properties.route_id;

                        if (rId && forecastLookup[rId]) {
                            feat.properties.is_forecast = true; 
                            feat.properties.f_avg = forecastLookup[rId].avg_daily;
                            feat.properties.f_peak = forecastLookup[rId].peak_daily;
                            feat.properties.f_total = forecastLookup[rId].total_est;
                            feat.properties.f_joint = forecastLookup[rId].joint_use;
                            feat.properties.f_time = forecastLookup[rId].timeline;
                        } else {
                            feat.properties.is_forecast = false;
                        }
                    }
                    map.getSource('a1-routes-source').setData(a1_data);
                }

                if (!map.getLayer('forecast-overlay-layer')) {
                    map.addLayer({
                        id: 'forecast-overlay-layer',
                        type: 'line',
                        source: 'a1-routes-source',
                        filter: ['==', 'is_forecast', true], 
                        paint: { 'line-color': '#007bff', 'line-width': 6, 'line-opacity': 0.8 }
                    });

                    map.on('click', 'forecast-overlay-layer', function(e) {
                        var props = e.features[0].properties;
                        var rId = props.Route_ID || props.route_id || 'Unknown Route';
                        var htmlContent = 
                            '<div style="font-family: sans-serif; color: #333; min-width: 200px;">' +
                            '<h4 style="margin: 0 0 8px 0; border-bottom: 1px solid #ccc; padding-bottom: 4px; color: #007bff;">' + rId + '</h4>' +
                            '<p style="margin: 4px 0; font-size: 12px;"><b>Timeline:</b> ' + props.f_time + '</p>' +
                            '<p style="margin: 4px 0; font-size: 12px;"><b>Joint Use Road:</b> ' + props.f_joint + '</p>' +
                            '<div style="background: #f8f9fa; padding: 8px; margin-top: 8px; border-radius: 4px; border: 1px solid #eee;">' +
                            '<p style="margin: 2px 0; font-size: 11px;"><b>Average Daily:</b> ' + props.f_avg + ' veh/day</p>' +
                            '<p style="margin: 2px 0; font-size: 11px;"><b>Peak Daily:</b> <span style="color: red;">' + props.f_peak + ' veh/day</span></p>' +
                            '<p style="margin: 2px 0; font-size: 11px;"><b>Total Estimated:</b> ' + props.f_total + ' vehicles</p>' +
                            '</div></div>';

                        new mapboxgl.Popup().setLngLat(e.lngLat).setHTML(htmlContent).addTo(map);
                    });

                    map.on('mouseenter', 'forecast-overlay-layer', function() { map.getCanvas().style.cursor = 'pointer'; });
                    map.on('mouseleave', 'forecast-overlay-layer', function() { map.getCanvas().style.cursor = ''; });
                } else {
                    map.setLayoutProperty('forecast-overlay-layer', 'visibility', 'visible');
                }

                if (!map.getLayer('forecast-overlay-labels')) {
                    map.addLayer({
                        id: 'forecast-overlay-labels',
                        type: 'symbol',
                        source: 'a1-routes-source',
                        filter: ['==', 'is_forecast', true],
                        layout: {
                            'symbol-placement': 'line-center',
                            'text-field': ['concat', 'Avg: ', ['get', 'f_avg']],
                            'text-size': 13,
                            'text-offset': [0, -1]
                        },
                        paint: { 'text-color': '#ffffff', 'text-halo-color': '#004085', 'text-halo-width': 2 }
                    });
                } else {
                    map.setLayoutProperty('forecast-overlay-labels', 'visibility', 'visible');
                }
                
                statusText.innerHTML = "✅ Filtering " + routesCount + " active routes";
                statusText.style.color = "green";
                
                applyFilters(); 

            } catch (error) {
                console.error("Error processing dataset:", error);
                statusText.innerHTML = "❌ Failed to read CSV database.";
                statusText.style.color = "red";
            }
        } else {
            if (map.getLayer('forecast-overlay-layer')) {
                map.setLayoutProperty('forecast-overlay-layer', 'visibility', 'none');
            }
            if (map.getLayer('forecast-overlay-labels')) {
                map.setLayoutProperty('forecast-overlay-labels', 'visibility', 'none');
            }
            statusText.innerHTML = "Forecast filters cleared.";
            statusText.style.color = "#666";
        }
    }

    function toggleLayer(layerId) {
        if (map.getLayer(layerId)) {
            var visibility = map.getLayoutProperty(layerId, 'visibility');
            if (visibility === 'visible' || visibility === undefined) {
                map.setLayoutProperty(layerId, 'visibility', 'none');
            } else {
                map.setLayoutProperty(layerId, 'visibility', 'visible');
            }
        }
    }
</script>
</body>
</html>
